# Daily catalogue refresh: calls POST /api/cron/refresh on the deployed app.
# Does nothing until the APP_URL and CRON_SECRET repo secrets are both set.
name: Refresh

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: refresh # POST /api/cron/refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the refresh route
        # Secrets go through env, never straight into the script.
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Refresh skipped: APP_URL or CRON_SECRET not set."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 300 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/refresh"
