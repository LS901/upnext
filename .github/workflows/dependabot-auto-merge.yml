# Turns on auto-merge for Dependabot's patch and minor PRs (owner said,
# 2026-11-27). GitHub then merges each one only once every required check on
# main has passed, so nothing red lands. Majors are left for a person.
#
# pull_request_target, because Dependabot's pull_request runs get a read-only
# token. That is safe here only because this job never checks out or runs the
# PR's code: it reads Dependabot's metadata and calls the GitHub API. Keep it so.
name: dependabot-auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'LS901/upnext'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # update-type is the highest change in the PR, so a group with any major in it stays manual.
      - name: Enable auto-merge for patch and minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
